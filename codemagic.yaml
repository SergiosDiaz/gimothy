workflows:

  # ─────────────────────────────────────────────────────────────────
  # Release iOS con Shorebird (App Store / TestFlight)
  # Requiere en Codemagic Console:
  #   - SHOREBIRD_TOKEN  (Variables de entorno)
  #   - Certificado de distribución + perfil de aprovisionamiento
  #     en Team > Apple Developer Portal integration
  # ─────────────────────────────────────────────────────────────────
  ios-shorebird-release:
    name: iOS Release (Shorebird)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        # bundle_identifiers cubre tanto la app iOS como el Watch companion.
        # Codemagic fetcha ambos perfiles desde App Store Connect automáticamente.
        bundle_identifiers:
          - com.gimothy.gimothy
          - com.gimothy.gimothy.watchkitapp
      vars:
        BUNDLE_ID: com.gimothy.gimothy
      groups:
        - shorebird  # grupo con SHOREBIRD_TOKEN en Codemagic Console

    scripts:
      - name: Instalar Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo 'export PATH="$HOME/.shorebird/bin:$PATH"' >> $CM_ENV
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird --version

      - name: Flutter pub get
        script: flutter pub get

      - name: Generar proyecto Xcode con XcodeGen (iOS + watchOS)
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Instalar CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Configurar firma de código
        script: xcode-project use-profiles

      - name: Shorebird release iOS
        script: |
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird release ios \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ─────────────────────────────────────────────────────────────────
  # Build de debug sin firma (para verificar que compila)
  # ─────────────────────────────────────────────────────────────────
  ios-debug:
    name: iOS Debug (sin firma)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Generar proyecto Xcode con XcodeGen (iOS + watchOS)
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Instalar CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Analizar código
        script: flutter analyze --no-fatal-infos

      - name: Build iOS debug (sin firma)
        script: flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/iphonesimulator/*.app

  # ─────────────────────────────────────────────────────────────────
  # Patch Shorebird (actualización OTA sin pasar por App Store)
  # Usar después de un release ya publicado
  # ─────────────────────────────────────────────────────────────────
  ios-shorebird-patch:
    name: iOS Patch (Shorebird OTA)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - shorebird  # grupo con SHOREBIRD_TOKEN en Codemagic Console

    scripts:
      - name: Instalar Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo 'export PATH="$HOME/.shorebird/bin:$PATH"' >> $CM_ENV
          export PATH="$HOME/.shorebird/bin:$PATH"

      - name: Flutter pub get
        script: flutter pub get

      - name: Generar proyecto Xcode con XcodeGen (iOS + watchOS)
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Instalar CocoaPods
        script: |
          cd ios && pod install && cd ..

      - name: Shorebird patch iOS
        script: |
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird patch ios
